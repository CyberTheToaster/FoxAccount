<!DOCTYPE html>
<html>

<head>
    <title>Sign In</title>
    <link rel="stylesheet" href="css.css">
</head>

<body>
    <div class="page">
        <h1 class="ex">Sign In</h1>
        <h3 class="Contrast">Log in to an existing Account</h3>
        <h3 class="Contrast">Don't have one? <a href="index.html">Sign Up</a></h3>

        <input autocomplete="email" id="signinEmail" class="border" type="email" placeholder="Enter Email Here">
        <input autocomplete="current-password" id="signinPassword" class="border" type="password" placeholder="Enter Password Here">
        <p id="signinError" class="hidden"></p>
        <button class="UwU" onclick="validateSignIn()">Submit</button>
    </div>
</body>

</html>
