<!DOCTYPE html>
<html>

<head>
    <title>Sign Up</title>
    <link rel="stylesheet" href="css.css">
</head>

<body>
    <div class="page">
        <h1 class="ex">Sign Up</h1>
        <h3 class="Contrast">Create an Account</h3>
        <h3 class="Contrast">Already have one? <a href="Signin.html">Sign In</a></h3>

        <input autocomplete="email" id="emailInput" class="border" type="email" placeholder="Enter Email Here">
        <input autocomplete="new-password" id="passwordInput" class="border" type="password" placeholder="Enter Password Here">
        <p id="error" class="hidden"></p>
        <button class="UwU" onclick="submitSignUp()">Submit</button>
    </div>

    <!-- Script loaded at the end -->
    <script src="script.js"></script>
</body>

</html>
